    highlights:
      - "Led delivery of a production-grade agentic LLM chatbot for a major French banking group in a BFI-like environment, serving 10,000+ queries/month. Owned evaluation, optimization, guardrails and industrialization. Stack: Azure OpenAI, LangGraph, Azure AI Search."
