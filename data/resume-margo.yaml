summary: >
  Lead Data Scientist / AI Consultant (PhD in NLP) with 4+ years delivering GenAI, LLM and
  Machine Learning systems for financial services, from prototype to industrialized production.
  Led production AI serving 10,000+ monthly queries, ran 1,000+ LLM experiments across
  20+ model families, and built data-science pipelines at 50M+ customer scale. I pilot complex
  AI projects, mentor data scientists and AI engineers, and partner with data, backend and
  frontend teams to ship reliable, high-impact models under demanding banking constraints —
  quality-first delivery, stakeholder alignment and measurable business value.

experience:
