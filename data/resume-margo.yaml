      - "Ran 1,000+ experiments across 20+ model families on the Jean-Zay supercomputer (H100/A100/V100), quantifying performance-cost tradeoffs and characterizing failure modes and reliability limits."
      - "Mentored junior researchers and translated academic research into practical, reusable evaluation frameworks."
      - "Authored four international publications in top language-technology venues (Interspeech, LREC-COLING, LREC, TALN)."

