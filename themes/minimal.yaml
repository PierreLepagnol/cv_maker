colors:
  primary: "#2d2d2d"
  accent: "#4a7c96"
  muted: "#777777"
  rule: "#cccccc"

fonts:
  heading: "Roboto"
  body: "Roboto"
  mono: "Roboto"

sizes:
  name: "24pt"
  name_line: "28pt"
  hero_name: "27pt"
  hero_name_line: "31pt"
  title: "12pt"
  title_line: "15pt"
  headline_title: "11pt"
  headline_title_line: "14pt"
  section: "12pt"
  section_line: "14pt"
  sidebar_section: "10pt"
  sidebar_section_line: "12pt"
  body: "10pt"
  body_line: "13pt"
  lead: "10.5pt"
  lead_line: "14pt"
  small: "9pt"
  small_line: "11pt"
  meta_links: "9.5pt"
  meta_links_line: "12pt"
  entry_meta: "8.5pt"
  entry_meta_line: "10pt"
  margin_top: "0.7cm"
  margin_bottom: "0.7cm"
  margin_side: "0.5cm"

rules:
  section_rule_width: "0.4pt"
  section_spacing: "10pt"
  column_gap: "30pt"
  column_ratios: [0.36, 0.64]
  section_sidebar_gap_before: "4pt"
  section_sidebar_gap_after: "6pt"
  skill_stack_gap: "1pt"
  entry_stack_gap: "1pt"
  entry_stack_bottom_gap: "2pt"
  entry_spacing: "2pt"

macros:
  cvname:
    default: standard
    variants:
      standard: {}
      hero:
        size: hero_name
        line: hero_name_line
        color: accent
  cvtitle:
    default: standard
    variants:
      standard: {}
      headline:
        size: headline_title
        line: headline_title_line
        color: primary
        weight: bold
  cvmeta:
    default: standard
    variants:
      standard: {}
      links:
        size: meta_links
        line: meta_links_line
        color: accent
  cvbody:
    default: standard
    variants:
      standard: {}
      lead:
        size: lead
        line: lead_line
        color: primary
  cvsmall:
    default: standard
    variants:
      standard: {}
      detail:
        color: muted
  cventry:
    default: standard
    variants:
      standard:
        line1_right_color: muted
      stacked:
        layout: stacked
        meta_size: entry_meta
        meta_line: entry_meta_line
        line_gap: entry_stack_gap
        bottom_gap: entry_stack_bottom_gap
      inline:
        layout: inline
        line2_left_shape: italic
        line2_left_color: muted
        line1_right_color: muted
  cvskill:
    default: standard
    variants:
      standard:
        separator: " "
        value_color: muted
      compact:
        layout: stacked
        label_color: accent
        value_color: muted
        stack_gap: skill_stack_gap
  cvsectiontitle:
    default: standard
    variants:
      standard: {}
      sidebar:
        layout: sidebar
        size: sidebar_section
        line: sidebar_section_line
        color: accent
        case: uppercase
        rule_color: accent
        rule_length: "0.38\\linewidth"
        rule_gap_before: section_sidebar_gap_before
        rule_gap_after: section_sidebar_gap_after
