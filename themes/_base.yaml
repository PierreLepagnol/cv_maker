fonts:
  heading: "Roboto"
  body: "Roboto"

sizes:
  name: "24pt"
  name_line: "28pt"
  hero_name: "27pt"
  hero_name_line: "31pt"
  title: "12pt"
  title_line: "15pt"
  headline_title: "11pt"
  headline_title_line: "14pt"
  section: "12pt"
  section_line: "14pt"
  sidebar_section: "10pt"
  sidebar_section_line: "12pt"
  body: "10pt"
  body_line: "13pt"
  lead: "10.5pt"
  lead_line: "14pt"
  small: "9pt"
  small_line: "11pt"
  meta_links: "9.5pt"
  meta_links_line: "12pt"
  entry_meta: "8.5pt"
  entry_meta_line: "10pt"
  margin_top: "0.7cm"
  margin_bottom: "0.7cm"
  margin_side: "0.5cm"

rules:
  section_rule_width: "0.4pt"
  section_rule_gap: "2pt"
  section_spacing: "10pt"
  column_gap: "30pt"
  column_ratios: [0.36, 0.64]
  tight_spacing: "0pt"
  project_spacing: "-3pt"
  project_item_spacing: "-7pt"
  stack_gap: "1pt"
  entry_gap: "0pt"
  block_spacing: "-10pt"
  sidebar_rule_gap: "4pt"
  sidebar_spacing: "6pt"
  header_gap: "4pt"
  header_bottom_gap: "4pt"
  header_bottom_gap_no_summary: "-6pt"

macros:
  cvname:
    variants:
      hero:
        size: hero_name
        line: hero_name_line
        color: accent
  cvtitle:
    variants:
      headline:
        size: headline_title
        line: headline_title_line
        color: primary
        weight: bold
  cvmeta:
    variants:
      links:
        size: meta_links
        line: meta_links_line
        color: accent
  cvbody:
    variants:
      lead:
        size: lead
        line: lead_line
        color: primary
  cvsmall:
    variants:
      detail:
        color: muted
  cventry:
    default_style: base
    default_layout: standard
    styles:
      base:
        line2_left_shape: italic
        line2_left_color: muted
        line1_right_color: muted
    layouts:
      standard:
        mode: standard
      inline:
        mode: inline
      stacked:
        mode: stacked
  cvskill:
    default_style: base
    default_layout: inline
    styles:
      base:
        separator: " "
        value_color: muted
      aside:
        label_color: accent
        value_color: muted
    layouts:
      inline:
        mode: inline
      stacked:
        mode: stacked
  cvsectiontitle:
    default_style: base
    default_layout: standard
    styles:
      base: {}
      aside:
        size: sidebar_section
        line: sidebar_section_line
        color: accent
        case: uppercase
        rule_color: accent
        rule_length: "0.38\\linewidth"
    layouts:
      standard:
        mode: standard
      sidebar:
        mode: sidebar
